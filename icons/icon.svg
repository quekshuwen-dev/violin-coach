      <stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g transform="rotate(-28 256 256)">
    <!-- neck + scroll -->
    <rect x="240" y="70" width="32" height="200" rx="8" fill="#3B1D0E"/>
    <circle cx="256" cy="66" r="24" fill="#3B1D0E"/>
    <circle cx="256" cy="66" r="10" fill="#7C3AED"/>
