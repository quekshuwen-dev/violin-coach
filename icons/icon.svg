    <!-- f-holes -->
    <path d="M222 320 C212 340 214 372 224 392" stroke="#3B1D0E" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M290 320 C300 340 298 372 288 392" stroke="#3B1D0E" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- bridge + strings -->
    <rect x="228" y="352" width="56" height="12" rx="3" fill="#3B1D0E"/>
    <g stroke="#FFFFFF" stroke-width="3" opacity="0.9">
      <line x1="245" y1="80" x2="243" y2="440"/><line x1="252" y1="80" x2="251" y2="440"/>
      <line x1="260" y1="80" x2="261" y2="440"/><line x1="267" y1="80" x2="269" y2="440"/>
    </g>
    <!-- tailpiece -->
    <path d="M238 440 L274 440 L266 478 L246 478 Z" fill="#3B1D0E"/>
  </g>
  <!-- star -->
  <path fill="#FDE68A" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"
